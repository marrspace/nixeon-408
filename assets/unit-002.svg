<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Siluet unit 002">
  <defs>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FF3D68" stop-opacity=".30"/>
      <stop offset="55%"  stop-color="#FF3D68" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#FF3D68" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4DD9E8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#4DD9E8" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#4DD9E8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="300" height="400"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- garis horizon / lantai -->
    <line x1="20" y1="352" x2="280" y2="352" stroke="#FF3D68" stroke-opacity=".22" stroke-width="1"/>

    <!-- siluet: kepala + tanduk + bahu -->
    <g fill="url(#fig)" stroke="#FF3D68" stroke-opacity=".34" stroke-width="1.4" stroke-linejoin="round">
      <!-- tanduk kiri -->
      <path d="M126 116 C118 96 112 82 108 66 C104 52 108 42 116 38 C122 35 128 40 128 48 C128 60 132 74 138 92 Z"/>
      <!-- tanduk kanan -->
      <path d="M174 116 C182 96 188 82 192 66 C196 52 192 42 184 38 C178 35 172 40 172 48 C172 60 168 74 162 92 Z"/>
      <!-- kepala -->
      <path d="M150 104 C176 104 190 124 190 152 C190 182 174 200 150 200 C126 200 110 182 110 152 C110 124 124 104 150 104 Z"/>
      <!-- bahu / torso -->
      <path d="M150 200 C112 200 84 224 74 262 C66 292 62 322 60 352 L240 352 C238 322 234 292 226 262 C216 224 188 200 150 200 Z"/>
    </g>

    <!-- detail: visor mata -->
    <g stroke="#4DD9E8" stroke-opacity=".7" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M128 152 L142 148"/>
      <path d="M172 152 L158 148"/>
    </g>

    <!-- garis konstruksi -->
    <g stroke="#F2F0EB" stroke-opacity=".16" stroke-width="1" stroke-dasharray="3 5">
      <line x1="150" y1="30" x2="150" y2="352"/>
      <line x1="40" y1="152" x2="260" y2="152"/>
    </g>

    <!-- label unit -->
    <g font-family="monospace" font-size="11" fill="#80808C" letter-spacing="1.4">
      <text x="30" y="60">UNIT 002</text>
      <text x="30" y="74">STATUS: STANDBY</text>
      <text x="30" y="88">CLASS: MASCOT</text>
      <text x="212" y="60">SIG 98.4%</text>
      <text x="212" y="74">LNK: OK</text>
    </g>

    <!-- scanline -->
    <rect x="0" y="0" width="300" height="26" fill="url(#scan)">
      <animate attributeName="y" values="-26;400" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
